name: Matrix Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04
        node:
          - 18
          - 20
        exclude:
          - os: ubuntu-22.04
            node: 18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node }}-npm
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-

      - name: Print versions
        run: |
          node --version
          npm --version

      - name: Create report
        run: |
          mkdir -p out
          cat > "out/report-${{ matrix.os }}-${{ matrix.node }}.txt" <<EOF
          Runner OS: ${{ matrix.os }}
          Node version: ${{ matrix.node }}
          Run number: $GITHUB_RUN_NUMBER
          EOF

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}-${{ matrix.node }}
          path: out/report-${{ matrix.os }}-${{ matrix.node }}.txt

  collect:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Print all reports
        run: |
          find collected -type f -name "*.txt" -print -exec cat {} \;
