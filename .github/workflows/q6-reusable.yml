name: Reusable Deployment

on:
  workflow_call:
    inputs:
      target_env:
        description: Target environment
        required: true
        type: string

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run greeting action
        id: greet
        uses: ./.github/actions/greet
        with:
          name: GitHub
          env_name: ${{ inputs.target_env }}

      - name: Print greeting
        run: echo "${{ steps.greet.outputs.greeting }}"

      - name: Fake deploy
        run: echo "Deploying to ${{ inputs.target_env }}... done."
